# GhostPort network performance tuning
# Applied 2026-03-19 — optimized for WireGuard VPN throughput

# BBR congestion control — better throughput over VPN tunnels
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Larger TCP buffers — auto-tune up to 16MB for tunnel latency
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216

# TCP Fast Open both directions
net.ipv4.tcp_fastopen = 3

# Reduce TIME_WAIT sockets
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# Conntrack tuning — faster recycling for router workload
net.netfilter.nf_conntrack_tcp_timeout_established = 1800
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 60

# Burst handling
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 5000
