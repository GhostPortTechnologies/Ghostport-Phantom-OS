# GhostPort WAN throughput tuning — applied 2026-05-02
# Complements 99-ghostport-perf.conf (BBR + fq + 16M TCP buffers).
# These keys are net-new; no conflict with the existing perf file.

# Auto MTU probing — important for tunnel paths where PMTUD can blackhole
net.ipv4.tcp_mtu_probing = 1

# Receive Packet Steering hash table — required for RPS to spread softirq
net.core.rps_sock_flow_entries = 32768
