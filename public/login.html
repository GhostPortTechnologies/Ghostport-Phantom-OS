<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GhostPort — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #39ff8f; --green-dim: #1a6a3a; --green-glow: #39ff8f44;
      --bg: #060a06; --bg2: #0a140a; --bg3: #0d1f0d;
      --border: #1a2e1a; --text: #c8f0c8; --text-dim: #4a7a4a; --text-faint: #2a4a2a;
      --red: #ff4444;
      --green-20: #39ff8f33; --green-33: #39ff8f55; --green-13: #39ff8f22;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none; z-index: 999;
    }
    @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.6} 94%{opacity:1} 97%{opacity:0.8} 98%{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .login-box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      padding: 40px 36px; width: 380px; max-width: 90vw;
      animation: fadeIn 0.6s ease;
    }
    .login-brand { text-align: center; margin-bottom: 28px; }
    .login-skull { margin-bottom: 12px; }
    .login-skull svg { width: 60px; height: 60px; filter: drop-shadow(0 0 12px var(--green)); }
    .login-title {
      font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900;
      color: var(--green); letter-spacing: 4px;
      text-shadow: 0 0 20px var(--green-glow); animation: flicker 8s infinite;
    }
    .login-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 3px; margin-top: 4px; }

    .login-label { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 8px; display: block; }
    .login-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 16px;
      padding: 12px 14px; letter-spacing: 3px; text-align: center; text-transform: uppercase;
      transition: border-color 0.3s;
    }
    .login-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 12px var(--green-glow); }
    .login-input::placeholder { color: var(--text-faint); letter-spacing: 2px; font-size: 12px; text-transform: none; }

    .login-btn {
      width: 100%; margin-top: 16px; padding: 12px;
      font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px;
      background: var(--bg3); border: 1px solid var(--green); color: var(--green);
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
    }
    .login-btn:hover { background: var(--green-dim); box-shadow: 0 0 14px var(--green-glow); }
    .login-btn:disabled { opacity: 0.4; pointer-events: none; }

    .login-error {
      margin-top: 14px; font-size: 11px; color: var(--red); text-align: center;
      min-height: 16px;
    }

    .login-hint {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
      font-size: 9px; color: var(--text-faint); text-align: center; line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-brand">
    <div class="login-skull">
      <img src="/logo.png" alt="GhostPort" style="width:80px;height:80px;border-radius:50%;filter:drop-shadow(0 0 12px var(--green))"/>
    </div>
    <div class="login-title">GHOSTPORT</div>
    <div class="login-sub">COMMAND DECK // AUTHENTICATE</div>
  </div>

  <form id="login-form">
    <div id="step-passcode">
      <label class="login-label">DEVICE PASSCODE</label>
      <input class="login-input" type="password" id="passcode-input" placeholder="GP-XXXX-XXXX-XXXX" autocomplete="off" autofocus/>
      <button class="login-btn" type="submit" id="login-btn">AUTHENTICATE</button>
    </div>
    <div id="step-totp" style="display:none">
      <label class="login-label">AUTHENTICATOR CODE</label>
      <input class="login-input" type="text" id="totp-input" placeholder="000000" autocomplete="one-time-code" inputmode="numeric" maxlength="8" style="letter-spacing:6px"/>
      <button class="login-btn" type="submit" id="totp-btn">VERIFY</button>
      <div style="margin-top:12px;text-align:center">
        <a href="#" id="backup-link" style="font-size:9px;color:var(--text-dim);text-decoration:none;letter-spacing:1px">USE BACKUP CODE</a>
      </div>
    </div>
  </form>
  <div class="login-error" id="login-error"></div>

  <div class="login-hint" id="hint-passcode">
    Find your passcode on the card included with your device<br/>
    or recover via SSH: <span style="color:var(--text-dim)">sudo gp-passcode reset</span>
  </div>
  <div class="login-hint" id="hint-totp" style="display:none">
    Open your authenticator app and enter the 6-digit code<br/>
    or use one of your 8-character backup codes
  </div>
  <div id="forgot-section" style="display:none;margin-top:14px;text-align:center">
    <a href="#" id="forgot-link" style="font-size:10px;color:var(--text-dim);text-decoration:none;letter-spacing:1px">FORGOT ACCESS? REQUEST RESET</a>
    <div id="forgot-status" style="font-size:10px;margin-top:8px;min-height:14px"></div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
