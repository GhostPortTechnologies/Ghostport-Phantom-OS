<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GhostPort — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #39ff8f; --green-dim: #1a6a3a; --green-glow: #39ff8f44;
      --bg: #060a06; --bg2: #0a140a; --bg3: #0d1f0d;
      --border: #1a2e1a; --text: #c8f0c8; --text-dim: #4a7a4a; --text-faint: #2a4a2a;
      --red: #ff4444;
      --green-20: #39ff8f33; --green-33: #39ff8f55; --green-13: #39ff8f22;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none; z-index: 999;
    }
    @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.6} 94%{opacity:1} 97%{opacity:0.8} 98%{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .login-box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      padding: 40px 36px; width: 380px; max-width: 90vw;
      animation: fadeIn 0.6s ease;
    }
    .login-brand { text-align: center; margin-bottom: 28px; }
    .login-skull { margin-bottom: 12px; }
    .login-skull svg { width: 60px; height: 60px; filter: drop-shadow(0 0 12px var(--green)); }
    .login-title {
      font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900;
      color: var(--green); letter-spacing: 4px;
      text-shadow: 0 0 20px var(--green-glow); animation: flicker 8s infinite;
    }
    .login-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 3px; margin-top: 4px; }

    .login-label { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 8px; display: block; }
    .login-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 16px;
      padding: 12px 14px; letter-spacing: 3px; text-align: center; text-transform: uppercase;
      transition: border-color 0.3s;
    }
    .login-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 12px var(--green-glow); }
    .login-input::placeholder { color: var(--text-faint); letter-spacing: 2px; font-size: 12px; text-transform: none; }

    .login-btn {
      width: 100%; margin-top: 16px; padding: 12px;
      font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px;
      background: var(--bg3); border: 1px solid var(--green); color: var(--green);
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
    }
    .login-btn:hover { background: var(--green-dim); box-shadow: 0 0 14px var(--green-glow); }
    .login-btn:disabled { opacity: 0.4; pointer-events: none; }

    .login-error {
      margin-top: 14px; font-size: 11px; color: var(--red); text-align: center;
      min-height: 16px;
    }

    .login-hint {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
      font-size: 9px; color: var(--text-faint); text-align: center; line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-brand">
    <div class="login-skull">
      <img src="/logo.png" alt="GhostPort" style="width:80px;height:80px;border-radius:50%;filter:drop-shadow(0 0 12px var(--green))"/>
    </div>
    <div class="login-title">GHOSTPORT</div>
    <div class="login-sub">COMMAND DECK // AUTHENTICATE</div>
  </div>

  <form id="login-form" onsubmit="doLogin(event)">
    <label class="login-label">DEVICE PASSCODE</label>
    <input class="login-input" type="password" id="passcode-input" placeholder="GP-XXXX-XXXX-XXXX" autocomplete="off" autofocus/>
    <button class="login-btn" type="submit" id="login-btn">AUTHENTICATE</button>
  </form>
  <div class="login-error" id="login-error"></div>

  <div class="login-hint">
    Find your passcode on the card included with your device<br/>
    or recover it via SSH: <span style="color:var(--text-dim)">sudo gp-passcode show</span>
  </div>
</div>

<script>
  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("login-btn");
    const input = document.getElementById("passcode-input");
    const error = document.getElementById("login-error");

    btn.disabled = true;
    btn.textContent = "AUTHENTICATING...";
    error.textContent = "";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: input.value }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = "/";
      } else {
        error.textContent = data.error;
        input.value = "";
        input.focus();
      }
    } catch (err) {
      error.textContent = "Connection failed — is GhostPort running?";
    }

    btn.disabled = false;
    btn.textContent = "AUTHENTICATE";
  }
</script>
<script>
  // Theme engine — reads saved theme from dashboard localStorage
  const THEME_MIGRATE = {
    green: "#39ff8f", purple: "#b44aff", blue: "#44aaff", red: "#ff4466",
    white: "#e0e0e0", cyan: "#00e5ff", amber: "#ffb300", gunmetal: "#8a9099",
  };
  function hsl2hex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
    return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
  }
  function hex2hsl(hex) {
    let r = parseInt(hex.slice(1,3), 16) / 255;
    let g = parseInt(hex.slice(3,5), 16) / 255;
    let b = parseInt(hex.slice(5,7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = 0; s = 0; }
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
    }
    return [h * 360, s * 100, l * 100];
  }
  function hueToTheme(hue, breath, sat) {
    const bri = breath !== undefined ? (0.92 + breath * 0.08) : 1;
    const s = sat !== undefined ? sat : 100;
    const accent = hsl2hex(hue, s, 60 * bri);
    const dim = hsl2hex(hue, s * 0.5, 22 * bri);
    const bgSat = Math.min(s, 30);
    const txtSat = Math.min(s, 20);
    return {
      accent, dim, glow: accent + "44", a20: accent + "33", a33: accent + "55", a13: accent + "22",
      bg: hsl2hex(hue, bgSat, 2.5), bg2: hsl2hex(hue, bgSat * 0.83, 4.5), bg3: hsl2hex(hue, bgSat * 0.67, 7),
      border: hsl2hex(hue, txtSat, 12),
      text: hsl2hex(hue, txtSat, 80 * bri), textDim: hsl2hex(hue, txtSat * 0.9, 35 * bri), textFaint: hsl2hex(hue, txtSat * 0.75, 20),
    };
  }
  function applyVars(t) {
    const r = document.documentElement.style;
    r.setProperty("--green", t.accent); r.setProperty("--green-dim", t.dim);
    r.setProperty("--green-glow", t.glow); r.setProperty("--green-20", t.a20);
    r.setProperty("--green-33", t.a33); r.setProperty("--green-13", t.a13);
    r.setProperty("--bg", t.bg); r.setProperty("--bg2", t.bg2); r.setProperty("--bg3", t.bg3);
    r.setProperty("--border", t.border); r.setProperty("--text", t.text);
    r.setProperty("--text-dim", t.textDim); r.setProperty("--text-faint", t.textFaint);
  }
  let saved = localStorage.getItem("gp-theme") || "#39ff8f";
  if (THEME_MIGRATE[saved]) { saved = THEME_MIGRATE[saved]; localStorage.setItem("gp-theme", saved); }
  if (saved === "rainbow") {
    let hue = 0, breathPhase = 0, last = 0;
    function frame(ts) {
      if (ts - last < 33) { requestAnimationFrame(frame); return; }
      last = ts;
      hue = (hue + 0.015 * 33) % 360;
      breathPhase += 0.002 * 33;
      applyVars(hueToTheme(hue, (Math.sin(breathPhase) + 1) / 2));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } else if (saved !== "#39ff8f") {
    const hex = saved.startsWith("#") ? saved : "#39ff8f";
    const [h, s] = hex2hsl(hex);
    applyVars(hueToTheme(h, undefined, s));
  }
</script>
</body>
</html>
