<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GhostPort — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #39ff8f; --green-dim: #1a6a3a; --green-glow: #39ff8f44;
      --bg: #060a06; --bg2: #0a140a; --bg3: #0d1f0d;
      --border: #1a2e1a; --text: #c8f0c8; --text-dim: #4a7a4a; --text-faint: #2a4a2a;
      --red: #ff4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none; z-index: 999;
    }
    @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.6} 94%{opacity:1} 97%{opacity:0.8} 98%{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .login-box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      padding: 40px 36px; width: 380px; max-width: 90vw;
      animation: fadeIn 0.6s ease;
    }
    .login-brand { text-align: center; margin-bottom: 28px; }
    .login-skull { margin-bottom: 12px; }
    .login-skull svg { width: 60px; height: 60px; filter: drop-shadow(0 0 12px var(--green)); }
    .login-title {
      font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900;
      color: var(--green); letter-spacing: 4px;
      text-shadow: 0 0 20px #39ff8f66; animation: flicker 8s infinite;
    }
    .login-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 3px; margin-top: 4px; }

    .login-label { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 8px; display: block; }
    .login-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 16px;
      padding: 12px 14px; letter-spacing: 3px; text-align: center; text-transform: uppercase;
      transition: border-color 0.3s;
    }
    .login-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 12px var(--green-glow); }
    .login-input::placeholder { color: var(--text-faint); letter-spacing: 2px; font-size: 12px; text-transform: none; }

    .login-btn {
      width: 100%; margin-top: 16px; padding: 12px;
      font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px;
      background: #0d2a1a; border: 1px solid var(--green); color: var(--green);
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
    }
    .login-btn:hover { background: #1a3a2a; box-shadow: 0 0 14px var(--green-glow); }
    .login-btn:disabled { opacity: 0.4; pointer-events: none; }

    .login-error {
      margin-top: 14px; font-size: 11px; color: var(--red); text-align: center;
      min-height: 16px;
    }

    .login-hint {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
      font-size: 9px; color: var(--text-faint); text-align: center; line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-brand">
    <div class="login-skull">
      <img src="/logo.png" alt="GhostPort" style="width:80px;height:80px;border-radius:50%;filter:drop-shadow(0 0 12px var(--green))"/>
    </div>
    <div class="login-title">GHOSTPORT</div>
    <div class="login-sub">COMMAND DECK // AUTHENTICATE</div>
  </div>

  <form id="login-form" onsubmit="doLogin(event)">
    <label class="login-label">DEVICE PASSCODE</label>
    <input class="login-input" type="password" id="passcode-input" placeholder="GP-XXXX-XXXX-XXXX" autocomplete="off" autofocus/>
    <button class="login-btn" type="submit" id="login-btn">AUTHENTICATE</button>
  </form>
  <div class="login-error" id="login-error"></div>

  <div class="login-hint">
    Find your passcode on the card included with your device<br/>
    or recover it via SSH: <span style="color:var(--text-dim)">sudo gp-passcode show</span>
  </div>
</div>

<script>
  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("login-btn");
    const input = document.getElementById("passcode-input");
    const error = document.getElementById("login-error");

    btn.disabled = true;
    btn.textContent = "AUTHENTICATING...";
    error.textContent = "";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: input.value }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = "/";
      } else {
        error.textContent = data.error;
        input.value = "";
        input.focus();
      }
    } catch (err) {
      error.textContent = "Connection failed — is GhostPort running?";
    }

    btn.disabled = false;
    btn.textContent = "AUTHENTICATE";
  }
</script>
</body>
</html>
