<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060A06">
<title>GhostPort — Offline</title>
<style>
  :root {
    --green: #39ff8f;
    --green-13: #39ff8f22;
    --bg: #060a06;
    --text: #c8f0c8;
    --text-dim: #4a7a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', 'Consolas', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .skull { font-size: 64px; margin-bottom: 16px; opacity: 0.6; }
  h1 { font-size: 20px; color: var(--green); letter-spacing: 2px; margin-bottom: 8px; }
  p { font-size: 13px; color: var(--text-dim); max-width: 300px; line-height: 1.6; }
  .retry {
    margin-top: 24px; padding: 12px 32px;
    background: none; border: 1px solid var(--green); color: var(--green);
    font-family: inherit; font-size: 13px; letter-spacing: 1px;
    border-radius: 4px; cursor: pointer; min-height: 44px;
  }
  .retry:active { background: var(--green-13); }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:0.3} }
</style>
</head>
<body>
  <div class="skull pulse">☠</div>
  <h1>RECONNECTING...</h1>
  <p>Unable to reach your GhostPort. Make sure you're connected to the GhostPort WiFi network.</p>
  <button class="retry" onclick="location.reload()">RETRY</button>
</body>
</html>
